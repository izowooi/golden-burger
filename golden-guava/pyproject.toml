[project]
name = "golden-guava"
version = "0.1.0"
description = "Evidence-first sports price-discrepancy research and controlled live experiments"
requires-python = ">=3.11"
dependencies = ["polybot-observability", "requests>=2.31.0", "PyYAML>=6.0", "websockets>=15.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
live = ["py-clob-client-v2>=1.0.1"]

[project.scripts]
polybot = "polybot.main:main"

[tool.uv.sources]
polybot-observability = { path = "../polybot-observability", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polybot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
