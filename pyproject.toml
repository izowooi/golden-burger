[project]
name = "polylab"
version = "0.1.0"
description = "Polymarket sports calibration research + autonomous strategy lab"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "websockets>=13",
    "pyyaml>=6",
    "py-clob-client-v2>=1.0.1",
    "numpy>=2",
    "pandas>=2.2",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
polylab = "polylab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/polylab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
