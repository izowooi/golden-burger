id: goal-over-all
family: goal_over
hypothesis: "기준선(buy-everything): 주요 리그 축구 전 경기의 Total 0.5 Over('한 골이라도 나온다')를 킥오프 3일(4320분)→5분 전 실행가(전체 호가 walk) 0.50–0.985 이면 기계적으로 매수해 정산까지 보유하면 수수료 후 손익이 0 근처인가(시장 효율성). AI 선별(llm-nil-draw·llm-nil-consensus)이 이 기준선보다 나은지 비교한다. 설계 docs/research/llm-forecast-study.md."
account: lion
mode: live
sports: [soccer]
stake_usdc: 5
params:
  leagues: [epl, lal, bun, sea, fl1, mls, ucl, uel, fifwc, euc, unl]
  entry_minutes_before_max: 4320
  entry_minutes_before_min: 5
  price_min: 0.5
  price_max: 0.985
  take_profit_price: null
  stop_loss_price: null
  take_profit_delta: 0.02
  take_profit_pct: null
  stop_loss_pct: 0.1
  hold_above_price: 0.99
  max_stop_spread: 0.1
  allow_in_play: false
  in_play_max_minutes: 30
  book_max_age_s: 900
bounds:
