  entry_minutes_before_min: [1, 14, 2]
  price_min: [0.5, 0.95, 0.05]
  price_max: [0.9, 0.99, 0.005]
  take_profit_price: [0.95, 0.999, 0.01]
  stop_loss_price: [0.2, 0.8, 0.05]
