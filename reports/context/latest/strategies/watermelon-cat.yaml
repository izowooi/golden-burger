id: watermelon-cat
family: watermelon
hypothesis: "경기 중 실행가(정확히 $5 ask VWAP) 0.92+ 승자 토큰은 실현 승률보다 싸게 거래된다(상단 favourite-longshot bias; 2026-10-02~ 진입 하한 0.93). 경기 후반으로 갈수록 과소평가가 커지는지 검증. A arm: 절대 손절 바닥 0.65 + early TP delta 0.02(2026-10-02~, B arm 0.04와 TP 수준 비교)."
account: cat
mode: live
sports: [soccer, nfl]
stake_usdc: 5
params:
  leagues: [epl, bun, fl1, lal, sea, mls, unl, ucl, uel]
  min_game_volume_usd: 20000
  prob_min: 0.93
  prob_max: 0.999
  stop_price: 0.65
  max_entry_drawdown: 0.30
  use_stored_stop: false
  hours_max: 4.0
  max_stop_spread: 0.10
  reentry_cooldown_hours: 720
  take_profit_delta: 0.02
  take_profit_cap: 0.99
  sport_overrides:
    nfl: {prob_min: 0.91, stop_price: 0.70, hours_max: 6.0}
bounds:
  min_game_volume_usd: [5000, 200000, 10000]
  prob_min: [0.85, 0.99, 0.01]
  prob_max: [0.98, 0.999, 0.005]
  stop_price: [0.40, 0.85, 0.05]
  max_entry_drawdown: [0.05, 0.50, 0.05]
