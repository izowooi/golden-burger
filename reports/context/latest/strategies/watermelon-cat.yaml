notes: "golden-watermelon-live Cat(soccer 0.92/0.65, nfl 0.91/0.70) 포팅. MLB는 legacy close-only라 제외. 원래 $5. 2026-10-02 사람 결정(thesis owner): 1분 주기로 후반 붕괴 손절이 실행되지 않아(Ireland 0.92→0.17, 손절 체결이 stop보다 0.42-0.48 낮음) take-profit early 도입. TP=min(entry_vwap+delta, cap) full-holding bid VWAP·수수료 후 순이익일 때만, stop보다 우선. A/B arm A: delta 0.02(짧은 보유·가장 얇은 꼬리) vs dog 0.04. soccer prob_min 0.92→0.93(max_step 이내). 백테스트(06-04~10-01, docs/research/backtests/2026-10-02-watermelon-tp-apricot.md)는 TP가 모든 셀·양 반기에서 보유-만기보다 ROI 약 0.8-2.1%p(pm0.93 에서 약 1.1%p) 나빴다(synthetic 1분 호가, 깊이 없음) — 실거래 손절 slippage가 이를 뒤집는지 검증하는 실험. 되돌리기: take_profit_delta: null(사람만, validator는 null 설정 불가). max_sells_per_cycle 1→5: TP 동시 체결이 붕괴 중인 다른 포지션의 손절을 다음 분으로 밀지 않게."
