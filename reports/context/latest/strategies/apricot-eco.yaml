notes: 'golden-apricot Eco 포팅. legacy 목표 $15(15/10/5 ladder)였으나 사용자 규칙으로 $5 시작. 2026-10-04
  사람 변경(백테스트 근거, docs/research/backtests/2026-10-04-apricot-retune.md): prob_min 0.90→0.89,
  take_profit_price 0.90→0.92 (fruit 와 같은 공통값, A/B 처치는 tick 90 vs 95 하나로 유지). 엔진 재생
  2026-03-01~10-04 ROI -1.33%→-0.93%(H1 -1.30→-1.17 / H2 -1.35→-0.71), MDD 57.7→48.6.
  여전히 음수, 확인된 edge 아님. | 2026-10-05 연구자 결정 `sports3:per-sport`: 종목별 mode·단위·파라미터.
  근거 docs/research/backtests/2026-10-05-per-sport-nba-nhl.md. MLB live→paper: 조기 익절(TP≤0.96)
  범위에서 두 반기 모두 0 이상인 셀이 하나도 없다(TP 0.98-0.99 만 일부 양수, 이웃 셀이 무너져 운). NBA·NHL 도 paper:
  통과 셀은 정산 손실 0건일 때만 양수라 손실 1건(−5 USDC)이면 반기 손익이 음수가 된다. 계좌 유지(master live): 남은 live
  포지션 청산·대사용.'
