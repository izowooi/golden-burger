  0.80-0.82/TP+20%/SL-8%/trailing 은 수수료·스프레드·1분 주기 손절 미끄러짐으로 구조적 손실 → 밴드 0.90-0.95, 진입 창 경기 전 72h + 킥오프
  후 60분, 절대 익절 +0.03(수수료 후 순이익일 때만 전량), 0.99 이상 보유, 손절·트레일링·상대 TP 끔. 백테스트도 edge 를 입증하지 못했다(분할 표본 ±1%p
  이내). A/B 는 tiger(고정 0.98 매도)와 청산 방식만 다르다. SL·trailing·상대 TP 는 bounds 에서 뺐으므로 다시 켜는 것은 사람만. 이전 포지션은 진입
  시 고정된 규칙을 유지한다.'
