notes: '2026-10-10 연구자 요청 `hypothesis:lts`(후반 임계 안정성)로 신설. paper, 5 USDC 고정, 지정가(maker)만:
  매수호가 한 틱 아래에 걸고 재호가 없이 대기(대기 시간 max_wait_minutes, null = 경기 끝까지), 경기당 1회 시도, 손절·익절
  없이 정산 보유. 종목별 (T, Y, 대기)는 사전 등록 grid(5 종목 × T 60·70·80·90% × Y 10개 × 대기 3개)에서 H1
  데이터만으로 고른 칸이다. 결과: 신호 순간 선두는 대부분 가격대로 보정되어 있고, 매수호가 한 틱 아래 지정가는 지는 경기에서 거의 100%·이기는
  경기에서 23–70% 만 체결되는 역선택 때문에 거의 모든 칸에서 taker 보다 나쁘다. R1–R6 을 통과한 것은 NFL 막판(170분, Y
  0.85–0.90)뿐이고 그것도 사전 등록 다중 비교 점검(H1 상위 20칸의 H2 중앙값 −5.1%)에서 실패해 전 종목 paper. 근거 docs/research/hypothesis-lts.md.
  B arm: 진행 60–70% 층의 선택 칸(연구자 예 ''60%·0.61'' 과 대비).'
