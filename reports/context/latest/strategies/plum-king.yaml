notes: 'golden-plum King(soccer TP .90/SL .12, nfl TP .85/SL .12) 포팅. MLB는 legacy close-only라 제외. 원래 $5. | 2026-10-04 연구자
  결정 B(`ai:plum-paper-next-step`): delta 기반 조기 익절을 paper 에서 테스트한다. take_profit_delta 0.03(진입가 +0.03 이상에서 보유 전량을 bid VWAP 로,
  수수료 후 순이익일 때만 매도; partial slice TP 대체), hold_above_price 0.99(매도 호가 0.99 이상이면 TP·손절·65분 강제청산 없이 정산까지 보유). 백테스트(docs/research/backtests/2026-10-04-cherry-plum.md):
  모든 셀이 약 −2% 로 음수이고 delta 는 soccer 손실만 줄였다(delta 가 작을수록 덜 나쁨: king +0.02 −1.35%·+0.03 −1.61%, 차이는 노이즈 수준이라 두 arm 모두 +0.03).
  NFL 은 delta 가 더 나빠서 sport_overrides.nfl.take_profit_delta 를 null(기존 TP 가격 유지)로 둔다. A/B 축은 기존 손절폭(king 0.12 vs queen 0.17)
  그대로. | 2026-10-05 연구자 결정 `sports3:per-sport`: 종목별 mode·단위·파라미터. 근거 docs/research/backtests/2026-10-05-per-sport-nba-nhl.md.
  NBA paper(밴드 0.70-0.73, TP 0.90, SL 0.12, 시작 60분 안 진입, 조기 익절 없음): 저장 수수료로는 통과했지만 현재 수수료(sports_fees_v3, 0.05)로 다시 재생하면 H1
  −1.15% 로 실패. soccer·NFL·NHL paper. | 2026-10-06 연구자 결정 `sports3:us-all`: MLB 추가, NBA·NHL·NFL·MLB 종목별 설정(전부 paper). 2024-04~2026-10
  grid (4,032셀, 현재 수수료 0.05)에서 규칙1 통과 셀이 어느 종목에도 없다(모두 약 −1.5~−2.5%): 미국 종목·MLB 에서 plum 의 우위는 확인되지 않는다. paper 값(손절 ≤ 0.12
  arm 중 이웃 포함 ROI 최고): nba n=1751 ROI -2.38% (H1 -2.57 / H2 -2.19); nhl n=1100 ROI -2.64% (H1 -3.59 / H2 -2.25); nfl n=281
  ROI -3.24% (H1 -1.75 / H2 -4.40); mlb n=1735 ROI -2.03% (H1 -2.18 / H2 -1.87). 근거 docs/research/backtests/2026-10-06-us-sports.md. | 2026-10-06 양수 조건 탐색: NFL 은 queen 과 같은 셀(0.65–0.68·60–120분·0.95 익절·거래량 2만+)에 손절 0.12 만 다른 비교 arm(백테스트 −2.61%). 근거 docs/research/backtests/2026-10-06-plum-positive-search.md.'
