notes: 'golden-plum Queen(soccer TP .90/SL .17, nfl TP .90/SL .12) 포팅. 원래 $5. | 2026-10-04 연구자 결정 B(`ai:plum-paper-next-step`):
  delta 기반 조기 익절을 paper 에서 테스트한다. take_profit_delta 0.03(진입가 +0.03 이상에서 보유 전량을 bid VWAP 로, 수수료 후 순이익일
  때만 매도; partial slice TP 대체), hold_above_price 0.99(매도 호가 0.99 이상이면 TP·손절·65분 강제청산 없이 정산까지 보유). 백테스트(docs/research/backtests/2026-10-04-cherry-plum.md):
  모든 셀이 약 −2% 로 음수이고 delta 는 soccer 손실만 줄였다(delta 가 작을수록 덜 나쁨: king +0.02 −1.35%·+0.03 −1.61%, 차이는 노이즈 수준이라 두 arm 모두 +0.03). NFL 은 delta 가 더 나빠서 sport_overrides.nfl.take_profit_delta
  를 null(기존 TP 가격 유지)로 둔다. A/B 축은 기존 손절폭(king 0.12 vs queen 0.17) 그대로.'
