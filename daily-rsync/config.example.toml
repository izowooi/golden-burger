schema_version = 1
ssh_host = "macmini-m5"
expected_ip = "192.168.50.23"
remote_jenkins_home = "/Users/jongwoopark/.jenkins"
remote_staging_root = "/Users/jongwoopark/.cache/daily-rsync"
remote_workspace_roots = [
  "/Users/jongwoopark/.jenkins/workspace",
  # "/Volumes/t7/jenkins/workspace",
]
# 같은 Job directory가 둘 이상의 root에 있으면 실제 workspace 한 곳에만
# .daily-rsync-workspace.json을 둡니다:
# {"schema_version":1,"job":"polybot-pomegranate",
#  "workspace":"/Volumes/t7/jenkins/workspace/polybot-pomegranate"}
data_root = "data"
initial_log_days = 60
log_retention_days = 365
minimum_free_gb = 50
batch_file_limit = 1000
batch_byte_limit_gb = 2
default_job_pattern = "polybot-*"

# 기존에 동기화한 Job을 다른 workspace root로 옮길 때만 exact workspace를
# 새 evidence epoch로 명시합니다. 이 table이 없으면 같은 로컬 destination으로
# 향하는 source path 변경은 계속 fail closed합니다.
# [workspace_epochs]
# "/Volumes/t7/jenkins/polybot-do" = "external-v2"
