# Golden Peach — in-play direct-book leader A/B.
# env > config.yaml > defaults. Real orders always require explicit --live.

trading:
  lifecycle_mode: active
  sport_family: soccer
  buy_amount_usdc: 5.0

  # Gamma server-side prefilter, followed by baseline-$5 direct books.
  min_liquidity: 5000
  min_volume_24h: 0
  min_cumulative_volume: 5000

  # Ten simultaneous games. One event may fill exactly once.
  max_positions: 10
  max_event_positions: 1
  max_new_positions_per_cycle: 5
  # One failed exit must not suppress exits for unrelated games.
  max_emergency_sells_per_cycle: 10

  experiment_capital_usdc: 50
  max_drawdown_stop: 0.20
  reentry_cooldown_hours: 720
  max_snapshot_gap_minutes: 2
  fok_reconciliation_timeout_minutes: 2
  stop_sell_quarantine_timeout_minutes: 180

  min_order_size: 5.0
  min_order_buffer_shares: 0.0
  yes_only_mode: false

  experiment_start_utc: 2026-08-30T00:00:00Z
  experiment_entry_end_utc: 2026-09-13T00:00:00Z
  experiment_followup_end_utc: 2026-09-20T00:00:00Z

  entry:
    prob_min: 0.60
    prob_max: 0.94
    max_source_minute: 10
    min_leader_margin: 0.005
    max_entry_spread: 0.05
    # Eco arm A. Fruit and Grey override only this value to 0.05.
    take_profit_delta: 0.03
    stop_loss_delta: 0.10
    late_exit_minute: 80
    late_profit_fraction: 0.50
    # At/after minute 80 a losing position is held for proven resolution.
    stop_cutoff_minute: 80
    stop_price: 0.01
    max_entry_drawdown: 0.10
    max_stop_slippage: 0.05
    max_stop_spread: 0.10
    max_stop_loss_fraction: 1.0
    hours_min: 0
    hours_max: 4

  archive:
    prob_min: 0.0
    hours_max: 4
    retention_days: 60

  excluded_categories: []

simulation_mode: true
