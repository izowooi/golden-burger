# polylab Jenkins jobs (Mac mini). Apply with: uv run python jenkins/sync_jobs.py [--apply]
# Secrets are read by polylab from ~/.polylab/*.env on the Mac mini, so no credential bindings are needed.
# Every job runs in the single runtime checkout on the external disk and fails closed if it is not mounted.
defaults:
  keep_builds: 300
  timeout_minutes: 10
jobs:
  polylab-tick:
    description: "1분마다: 라이브 경기 가격·호가 수집(poll) → 모든 전략 변형 실행(청산→진입→대사)"
    cron: "* * * * *"
    timeout_minutes: 3
    keep_builds: 1500
    command: "uv run --no-sync polylab tick"
  polylab-discover:
    description: "10분마다: Gamma 에서 5개 종목 경기·마켓 탐색, 정산 상태 갱신"
    cron: "H/10 * * * *"
    command: "uv run --no-sync polylab discover"
  polylab-stream:
    description: "WebSocket 수집 daemon(sports+market). 한 빌드가 최대 59분 실행되고, 끝나거나 죽으면 대기 중인 다음 빌드가 즉시 이어받는다(launchd 는 macOS 가 외장하드 접근을 막아 사용하지 않음)"
    cron: "* * * * *"
    timeout_minutes: 65
    keep_builds: 200
    command: "uv run --no-sync polylab stream --run --duration 3540"
  polylab-backfill:
    description: "매시: 종료 경기 prices-history·trades·resolution 백필 + 과거 시즌 점진 백필"
    cron: "H * * * *"
    timeout_minutes: 55
    command: "uv run --no-sync polylab backfill --recent && uv run --no-sync polylab backfill --historical --budget-minutes 40"
  polylab-publish:
    description: "5분마다: git pull → 대시보드 JSON(Supabase Storage) 갱신 + 상태 점검"
    cron: "H/5 * * * *"
    timeout_minutes: 8
    pull: true
    command: "uv run --no-sync polylab publish; uv run --no-sync polylab health --alert || true"
  polylab-retro-daily:
    description: "일일 회고(새벽 03:30·아침 08:00·저녁 19:30 KST): 리포트 → AI 회고 → 가드레일 적용 → commit/push → Slack"
    cron: "TZ=Asia/Seoul\n30 3 * * *\n0 8 * * *\n30 19 * * *"
    timeout_minutes: 45
    pull: true
    command: "uv run --no-sync polylab retro daily"
  polylab-retro-weekly:
    description: "주간 회고(월 08:30 KST): 백테스트 기반 파라미터 탐색·paper 변형 제안"
    cron: "TZ=Asia/Seoul\n30 8 * * 1"
    timeout_minutes: 150
    pull: true
    command: "uv run --no-sync polylab retro weekly"
  polylab-retro-monthly:
    description: "월간 회고(매월 1일 09:00 KST): 논문용 연구 요약 docs/research/monthly"
    cron: "TZ=Asia/Seoul\n0 9 1 * *"
    timeout_minutes: 120
    pull: true
    command: "uv run --no-sync polylab retro monthly"
  polylab-llm-forecast:
    description: "AI 교차검증(10:00 KST): 향후 30h 주요 리그 축구 경기(유럽 5대 리그+MLS 우선, 최대 40경기)의 0:0 확률을 Claude·ChatGPT 가 각각 예측 → research/llm_forecasts.db(append-only) → 합의 top-3 와 O/U 0.5 픽(두 AI 모두 상위 8위: 0:0 안 날 경기 Over, 날 경기 Under)을 고정 기록하고 Slack 으로. ai-ou05-red(red, 실거래)가 픽에 수수료 없는 지정가를 건다"
    cron: "TZ=Asia/Seoul\n0 10 * * *"
    timeout_minutes: 110
    pull: true
    command: "uv run --no-sync polylab forecast daily"
  polylab-manual-sync:
    description: "15분마다: 연구자 수동 베팅(트랙 2) 공개 지갑 주소(~/.polylab/watch.env, 키 없음)의 Data API 체결·포지션 → data/manual/<alias>.db, manual/predictions 파싱"
    cron: "H/15 * * * *"
    timeout_minutes: 10
    command: "uv run --no-sync polylab manual sync"
  polylab-ou05:
    description: "1분마다: 축구 O/U 0.5 전 시장(모든 리그) Over·Under 양쪽 호가(L1 bid/ask/size/last) → data/ou05/YYYY-MM.db. 변화 시 또는 10분마다 1행. tick 과 분리(전형 1–2초). 설계 docs/research/ou05-overround-study.md"
    cron: "* * * * *"
    timeout_minutes: 2
    keep_builds: 1500
    command: "uv run --no-sync polylab ou05 poll"
  polylab-ou05-discover:
    description: "매시: Gamma 에서 열린 축구 O/U 0.5 시장 전부를 생성 시점부터 등록(킥오프 갱신), 종료·정산·최종 스코어 반영 → 이어서 과거 중간가 백필(2026-02-01~, 주요 리그 우선, 25분 예산, 재개 가능) → 대시보드 /ou05 집계(analyze ou05, 업로드는 polylab-publish)"
    cron: "H * * * *"
    timeout_minutes: 40
    command: "rc=0; uv run --no-sync polylab ou05 discover || rc=$?; uv run --no-sync polylab ou05 backfill --budget-minutes 25 || rc=$?; uv run --no-sync polylab analyze ou05 --no-export || rc=$?; exit $rc"
  polylab-general:
    description: "1분마다: 종료(end_ref)까지 4일 이내인 전 카테고리 마켓(general, core.db 미추적분)의 YES 토큰 L1 호가 → data/general/YYYY-MM.db. 변화 시 또는 10분마다 1행. 예산 초과 시 POLYLAB_GENERAL_POLL_EVERY=5 로 5분 주기(단 paper 체결은 180초 신선도라 대부분 미체결). cherry 진입·청산의 데이터"
    cron: "* * * * *"
    timeout_minutes: 2
    keep_builds: 1500
    command: "uv run --no-sync polylab general poll"
  polylab-general-discover:
    description: "10분마다: Gamma 전 카테고리에서 end_ref 4일 이내·거래량 5천+ 마켓 등록(volume/liquidity 이력), 종료·정산 반영 → 이어서 종료 마켓 과거 가격 백필(2026-02-01~, 거래량 1만+, 종료 전 4.5일, 5분 fidelity, 6분 예산, 재개 가능)"
    cron: "H/10 * * * *"
    timeout_minutes: 9
    command: "rc=0; uv run --no-sync polylab general discover || rc=$?; uv run --no-sync polylab general backfill --budget-minutes 6 || rc=$?; exit $rc"
  polylab-storage-compact:
    description: "매월 3일 04:00 KST: 지난 달 이전 shard(books/ou05/general) 중 하루 이상 쓰기가 없는 것을 VACUUM(삭제 없음). 증가 예산 점검은 polylab health 가 5분마다"
    cron: "TZ=Asia/Seoul\n0 4 3 * *"
    timeout_minutes: 60
    command: "uv run --no-sync polylab storage compact --apply"
