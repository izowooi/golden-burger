notes: '2026-10-03 연구자 결정: 미국 종목은 수익 전략·파라미터가 확인될 때까지 수집과 paper 시뮬레이션만. plum-king 의 현재 파라미터에서 출발. live 전환은 연구자만 결정한다. | 2026-10-04
