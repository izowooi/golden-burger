notes: 'golden-apricot Fruit 포팅. legacy 목표 $15였으나 사용자 규칙으로 $5 시작. 2026-10-02 사람 변경:
  entry_tick_minute 85→95(백테스트 2026-03-01~10-01 MLB 전체, docs/research/backtests/2026-10-02-watermelon-tp-apricot.md).
  tick 95 는 tick 80/85/90 대비 prob_min·TP 모든 조합에서 양 반기 모두 나았고(28 조합 중 27), 100-120
  대비로는 섞였다(21 조합 중 12 에서 양 반기 우위). 이 셀(tick95/pm0.90/TP0.90) ROI -0.61%(H1 -0.61%
  / H2 -0.61%), 현재값(tick85) -1.59%(-1.16% / -1.97%). 개선이지 확인된 edge 가 아니다(어떤 셀도 H2
  양수 아님). TP 0.99 는 평균 +1.1%p 더 좋았지만 이득이 H1(fee 0.03 체제)에 몰리고 H2 에선 prob_min ±0.02
  에 따라 부호가 바뀌어 보류. tick 2 step(max_step 5) 변경은 의도적 사람 override. eco(tick 90)와 A/B
  처치는 진입 tick 하나로 유지. MLB 포스트시즌만 남아 실거래 증거는 2027 시즌 전까지 얇다. 2026-10-04 사람 변경(docs/research/backtests/2026-10-04-apricot-retune.md):
  10-02 이후 진입 0건은 버그가 아니라 포스트시즌 대상 경기 4개 중 tick 95 에 선두 0.90 이상인 경기가 없었기 때문. 공통값 prob_min
  0.90→0.89, take_profit_price 0.90→0.92(eco 와 동일). 엔진 재생 ROI -0.61%→-0.40%(H1 -0.48→-0.40
  / H2 -0.73→-0.41), MDD 30.3→22.9. | 2026-10-05 연구자 결정 `sports3:per-sport`: 종목별 mode·단위·파라미터.
  근거 docs/research/backtests/2026-10-05-per-sport-nba-nhl.md. MLB live→paper: 조기 익절(TP≤0.96)
  범위에서 두 반기 모두 0 이상인 셀이 하나도 없다(TP 0.98-0.99 만 일부 양수, 이웃 셀이 무너져 운). NBA·NHL 도 paper:
  통과 셀은 정산 손실 0건일 때만 양수라 손실 1건(−5 USDC)이면 반기 손익이 음수가 된다. 계좌 유지(master live): 남은 live
  포지션 청산·대사용.'
