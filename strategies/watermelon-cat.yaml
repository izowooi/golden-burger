notes: 'golden-watermelon-live Cat(soccer 0.92/0.65, nfl 0.91/0.70) 포팅. MLB는 legacy close-only라 제외. 원래 $5. 2026-10-02 사람 결정(thesis
  owner): 1분 주기로 후반 붕괴 손절이 실행되지 않아(Ireland 0.92→0.17, 손절 체결이 stop보다 0.42-0.48 낮음) take-profit early 도입. TP=min(entry_vwap+delta,
  cap) full-holding bid VWAP·수수료 후 순이익일 때만, stop보다 우선. A/B arm A: delta 0.02(짧은 보유·가장 얇은 꼬리) vs dog 0.04. soccer prob_min
  0.92→0.93(max_step 이내). 백테스트(06-04~10-01, docs/research/backtests/2026-10-02-watermelon-tp-apricot.md)는 TP가 모든 셀·양 반기에서
  보유-만기보다 ROI 약 0.8-2.1%p(pm0.93 에서 약 1.1%p) 나빴다(synthetic 1분 호가, 깊이 없음) — 실거래 손절 slippage가 이를 뒤집는지 검증하는 실험. 되돌리기: take_profit_delta:
  null(사람만, validator는 null 설정 불가). max_sells_per_cycle 1→5: TP 동시 체결이 붕괴 중인 다른 포지션의 손절을 다음 분으로 밀지 않게. | 2026-10-03 연구자 결정:
  NFL·NBA·NHL 은 실거래 범위에서 제외(수집·paper 시뮬레이션만). | 2026-10-05 연구자 결정 `sports3:per-sport`: 종목별 mode·단위·파라미터. 근거 docs/research/backtests/2026-10-05-per-sport-nba-nhl.md.
  soccer 값·live 유지. NBA live 5 USDC(A(cat): NBA 진입 0.87, 손절 0.70, 조기 익절 없음=정산 보유: NBA 백테스트에서 조기 익절 셀은 모두 강건하지 않았다), NBA 전용
  한도 max_open 50. NHL paper(강건한 양수 셀 없음). NFL 은 실거래 제외(sports 에 없음, override 는 기록용). | 2026-10-06 연구자 결정 `sports3:us-all`:
  미국 종목·MLB 를 모두 이 변형의 종목별 설정으로(전부 paper, 5 USDC). NBA live(10-21 예정)를 취소하고 paper 로 되돌렸다: 2024-04~2026-10 두 시즌 grid(3,850셀,
  현재 수수료 0.05)에서 규칙1(n≥40·전체·두 반기 ≥ 0) 통과 셀이 NBA·NHL·NFL·MLB 모두 0개, 10-05 NBA 값(0.87/0.70)은 2025-11~12 엔진 재생 −1.73%(479건).
  paper 값은 사전 등록 규칙(이웃 포함 ROI 최고)으로 고른 정산 보유 arm: nba n=2302 ROI -0.45% (H1 -0.59 / H2 -0.33); nhl n=1500 ROI -0.57% (H1 -0.54
  / H2 -0.57); nfl n=457 ROI -0.60% (H1 -0.83 / H2 -0.44); mlb n=1937 ROI -0.05% (H1 -0.31 / H2 +0.20). min_wall_minute=경기
  예정 시작 후 진입 하한(벽시계), min_game_volume_usd 는 최종 거래량(백테스트에선 look-ahead). live 전환은 결정론 승격 게이트만. 근거 docs/research/backtests/2026-10-06-us-sports.md.'
