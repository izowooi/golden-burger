notes: "2026-10-03 thesis owner 결정(track 1): 이 변형은 live 허용 대상이다(llm_nil family 의 live 거부 가드는 id llm-nil-consensus + source consensus 에만 풀림, llm-nil-draw 는 계속 paper 전용). 자금 있는 계좌가 지정될 때까지 paper. live 전환은 한 줄 변경(mode: live + account: <alias>)이며 사람만 한다(autopilot 은 live 로 올릴 수 없다). 합의가 비는 날(한 엔진 실패)은 진입하지 않는다. 예측은 Jenkins polylab-llm-forecast(10:00 KST)."
