notes: 'golden-plum Queen(soccer TP .90/SL .17, nfl TP .90/SL .12) 포팅. 원래 $5. | 2026-10-04 연구자 결정 B(`ai:plum-paper-next-step`):
  delta 기반 조기 익절을 paper 에서 테스트한다. take_profit_delta 0.03(진입가 +0.03 이상에서 보유 전량을 bid VWAP 로, 수수료 후 순이익일 때만 매도; partial slice
  TP 대체), hold_above_price 0.99(매도 호가 0.99 이상이면 TP·손절·65분 강제청산 없이 정산까지 보유). 백테스트(docs/research/backtests/2026-10-04-cherry-plum.md):
  모든 셀이 약 −2% 로 음수이고 delta 는 soccer 손실만 줄였다(delta 가 작을수록 덜 나쁨: king +0.02 −1.35%·+0.03 −1.61%, 차이는 노이즈 수준이라 두 arm 모두 +0.03).
  NFL 은 delta 가 더 나빠서 sport_overrides.nfl.take_profit_delta 를 null(기존 TP 가격 유지)로 둔다. A/B 축은 기존 손절폭(king 0.12 vs queen 0.17)
  그대로. | 2026-10-05 연구자 결정 `sports3:per-sport`: 종목별 mode·단위·파라미터. 근거 docs/research/backtests/2026-10-05-per-sport-nba-nhl.md.
  NBA paper(SL 0.17 셀은 통과했지만 이웃 셀 강건성 미달: 4/9). soccer·NFL·NHL paper. A/B 축(손절폭 0.12 vs 0.17) 유지. | 2026-10-06 연구자 결정 `sports3:us-all`:
  MLB 추가, NBA·NHL·NFL·MLB 종목별 설정(전부 paper). 2024-04~2026-10 grid (4,032셀, 현재 수수료 0.05)에서 규칙1 통과 셀이 어느 종목에도 없다(모두 약 −1.5~−2.5%):
  미국 종목·MLB 에서 plum 의 우위는 확인되지 않는다. paper 값(손절 ≥ 0.17 arm 중 이웃 포함 ROI 최고): nba n=1751 ROI -1.75% (H1 -1.90 / H2 -1.60); nhl
  n=1100 ROI -1.99% (H1 -2.15 / H2 -1.93); nfl n=316 ROI -1.48% (H1 -2.48 / H2 -0.72); mlb n=1986 ROI -2.22% (H1 -2.32 / H2
  -2.12). 근거 docs/research/backtests/2026-10-06-us-sports.md. | 2026-10-06 양수 조건 탐색(`paper_ready:plum-queen`, 88,680셀): NFL 0.65–0.68·시작 60–120분·0.95 익절·손절 없음(stop_loss_delta 0.65 ≈ 없음)·거래량 2만+ 가 R1–R7 통과(349건 +4.82%, 엔진 345건 +5.24%; 다중 비교 점검은 약함) → paper out-of-sample 시험. live 는 새 paper 표본으로만. 근거 docs/research/backtests/2026-10-06-plum-positive-search.md.'
