notes: '2026-10-06 연구자 피드백으로 신설(paper, 5 USDC 고정, 계좌 없음 — 자금 있는 여유 계좌가 없어 attention
  으로 요청). grid 8,694셀×4종목(현재 수수료 0.05, R1–R6 사전 등록) 선택 규칙: R1–R6 통과 + X ≤ 0.9(연구자
  제외 조건) + 조기 익절(Z 있음) 중 이웃 포함 ROI 최고. NFL T170/Y0.88/Z0.98/X0.70 n=107 +6.5%(H1 +5.8/H2
  +7.2), NHL T160/Y0.80/Z0.98/X0.60 n=41 +14.2%(H1 +20.4/H2 +10.3), NBA T150/Y0.90/Z0.98/X0.60
  n=67 +4.2%(다중 비교 점검 음수 — 약함), MLB T190/Y0.75/Z0.90/X0.60 n=57 +6.8%(한 시즌, 이웃 포함
  +0.1% — 약함). 엔진 재생(정규시즌, R7) NFL 105건 +6.27%·NHL 39건 +13.92%·NBA 67건 +4.10%·MLB
  59건 +6.96%. 단순 규칙 ''언제든 0.80 교차 매수→0.96 매도''는 전 종목 음수(NFL −2.9%, NHL −2.4%, NBA
  −3.4%, MLB −3.0%). NFL 은 apricot-eco NFL 과 진입 경기 37% 겹침. 근거 docs/research/hypothesis-late-leader-convergence.md.'
