# Golden Watermelon Live — env-selected soccer/MLB/NHL in-play winner A/B.
# env > config.yaml > defaults. Real orders always require explicit --live.

trading:
  lifecycle_mode: active
  sport_family: soccer

  # The experiment's only order notional.
  buy_amount_usdc: 5.0

  # Gamma applies these cumulative server-side gates before Python sees an
  # event. A fresh complete exact-$5 ask walk remains the final execution gate.
  min_liquidity: 5000
  min_volume_24h: 0
  min_cumulative_volume: 5000

  # At most $100 requested notional open, and never more than one result per game.
  max_positions: 20
  max_event_positions: 1
  # A single faulty cycle cannot deploy the whole experiment budget.  Five
  # simultaneous games still fit, while exact $5 sizing caps new exposure at $25.
  max_new_positions_per_cycle: 5
  # One anomalous exit can never fan out across every holding in one run.
  max_emergency_sells_per_cycle: 1

  # Closed-strategy lesson: a documented loss boundary is not enough.  Once
  # confirmed SELL P&L plus proven-resolution P&L reaches -$10, new BUYs stop
  # while existing positions continue through the normal lifecycle.
  experiment_capital_usdc: 100
  max_drawdown_stop: 0.10
  reentry_cooldown_hours: 720
  max_snapshot_gap_minutes: 15
  # DELAYED FOK는 exact order/trade 부재가 증명되면 2분 뒤 0체결로 종결한다.
  fok_reconciliation_timeout_minutes: 2
  # 손절 제출/대사가 계속 실패해도 다른 경기를 막지 않는다. 3시간 뒤에는
  # 성공 매도로 꾸미지 않고 미확정 노출 격리 상태로 자동 종결한다.
  stop_sell_quarantine_timeout_minutes: 180

  min_order_size: 5.0
  min_order_buffer_shares: 0.0
  yes_only_mode: true

  experiment_start_utc: 2026-08-29T04:00:00Z
  experiment_entry_end_utc: 2026-09-05T04:00:00Z
  experiment_followup_end_utc: 2026-09-12T04:00:00Z

  # Cat is arm A. Dog overrides only prob_min=0.99 in Jenkins. Both active
  # Cat keeps its v2h runtime to manage existing positions; Dog and the new
  # MLB/NHL jobs share this source contract. Cadence is a Jenkins concern.
  entry:
    prob_min: 0.96
    prob_max: 0.999
    stop_price: 0.70
    # Effective stop = max(0.70, confirmed entry VWAP - 0.05).
    max_entry_drawdown: 0.05
    # Never turn a protective trigger into an unrestricted market liquidation.
    max_stop_slippage: 0.05
    max_stop_spread: 0.10
    max_stop_loss_fraction: 0.35
    hours_min: 0
    hours_max: 4

  archive:
    prob_min: 0.0
    hours_max: 4
    retention_days: 60

  excluded_categories: []

simulation_mode: true
